# Overlay HTTPS (Caddy). No sustituye docker-compose.yml ni altera el bind 8080 del frontend.
# Local (certificado interno, puerto 8443):
#   docker compose -p smartbills-prod -f docker-compose.prod.yml -f docker-compose.https.yml up -d caddy
# EC2 (Let's Encrypt, 80+443). PUBLIC_HOST debe ser un DNS (p. ej. <eip>.sslip.io):
#   CADDYFILE=./deploy/Caddyfile CADDY_HTTP_PORT=80 HTTPS_PORT=443 PUBLIC_HOST=... \
#   docker compose -p smartbills-prod -f docker-compose.prod.yml -f docker-compose.https.yml up -d

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-8081}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-smartbills-cleaner@localhost}
    volumes:
      - ${CADDYFILE:-./deploy/Caddyfile.local}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
