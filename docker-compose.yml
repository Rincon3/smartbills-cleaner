services:
  postgres:
    image: postgres:15
    container_name: smartbills-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartbills
      POSTGRES_USER: smartbills
      POSTGRES_PASSWORD: smartbills
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: smartbills-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@smartbills.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: smartbills-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://smartbills:smartbills@postgres:5432/smartbills?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/apps/backend/node_modules
    depends_on:
      - postgres
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: smartbills-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - /app/apps/frontend/node_modules
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
