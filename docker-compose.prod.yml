# Producción. No sustituye docker-compose.yml (ese sigue siendo el de desarrollo).
# Uso: copiar .env.production.example → .env (gitignored) y:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartbills
      POSTGRES_USER: smartbills
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbills -d smartbills"]
      interval: 10s
      timeout: 5s
      retries: 8
    expose:
      - "5432"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://smartbills:${POSTGRES_PASSWORD}@postgres:5432/smartbills?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      ALLOW_SEED: ${ALLOW_SEED:-false}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_SDK_LOAD_CONFIG: "1"
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-amazon.titan-embed-text-v2:0}
      BEDROCK_BASE_MODEL: ${BEDROCK_BASE_MODEL:-amazon.nova-lite-v1:0}
      BEDROCK_ADJUSTED_MODEL: ${BEDROCK_ADJUSTED_MODEL:-amazon.nova-lite-v1:0}
      RAG_TOP_K: ${RAG_TOP_K:-3}
      MIN_RETRIEVAL_SCORE: ${MIN_RETRIEVAL_SCORE:-0.32}
    volumes:
      - uploads_data:/app/apps/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.prod
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 20s
      timeout: 5s
      retries: 8

volumes:
  postgres_data:
  uploads_data:
